name: Testes

# Testes unitários em todo PR: ao abrir, ao reabrir e a cada push no branch do PR.
# Node 24: testes + coverage + comentário no PR, e o lint. Node 20 (mínimo declarado): só os testes.
# O e2e (npm run e2e) precisa de Chromium e não roda aqui.
on:
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior, que já não vale mais.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unitários + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # só para o comentário com o coverage
    steps:
      # Actions fixadas pelo SHA do commit (a tag é só o comentário): uma tag pode ser movida, um SHA não.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # LTS; o projeto não tem dependências, então não há o que cachear

      - name: Testes com coverage
        id: tests
        run: npm run test:coverage

      # Roda mesmo com teste falhando (o coverage do que rodou ainda ajuda), mas não se o job foi cancelado.
      - name: Resumo do coverage
        if: ${{ !cancelled() }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          mkdir -p coverage
          node scripts/coverage-summary.mjs coverage/lcov.info | tee coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o lcov
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Um comentário só por PR: é atualizado a cada execução (o marcador é o de scripts/coverage-summary.mjs).
      # Informativo: se não conseguir comentar (ex.: PR do Dependabot, com token só de leitura), não reprova o PR.
      - name: Comentar o coverage no PR
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- myticket-coverage -->';
            const body = fs.readFileSync('coverage/summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # O ESLint vive isolado em tools/lint/ (a raiz do projeto não tem dependências). Instalação reproduzível pelo
  # lockfile (`npm ci`) e sem scripts de instalação de terceiros (`--ignore-scripts`).
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # o ESLint 10 pede Node >= 20.19

      - name: Instalar o ESLint
        run: npm run lint:install

      - name: Lint
        run: npm run lint

  # O README promete Node 20+ para `npm test`: testar o mínimo é o que torna isso verdade, não só uma afirmação.
  # As versões do meio não entram: se passa na mínima e na atual (job acima), não há o que elas acrescentem.
  # Sem coverage (as flags dele pedem Node >= 22.5): coverage e comentário ficam no job acima, no Node 24.
  node-minimo:
    name: Node 20 (versão mínima)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Testes
        run: npm test
